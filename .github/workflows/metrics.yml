name: Metrics

on:
  # Regenerate once a day at 06:00 UTC
  schedule:
    - cron: "0 6 * * *"
  # Allow manual runs from the Actions tab
  workflow_dispatch:
  # Regenerate on push to the default branch
  push:
    branches: ["main"]

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # ------------------------------------------------------------------
      # 1. Overview card — commit activity, repo counts, followers
      # ------------------------------------------------------------------
      - name: Overview
        uses: lowlighter/metrics@latest
        with:
          # Classic PAT stored as a repo secret. Fine-grained tokens are NOT
          # supported — GitHub's GraphQL API doesn't accept them.
          # Scopes: public_repo (add repo + read:org for private counts)
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.overview.svg
          base: header, activity, community, repositories
          config_timezone: America/New_York

      # ------------------------------------------------------------------
      # 2. Languages breakdown
      # ------------------------------------------------------------------
      - name: Languages
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.languages.svg
          base: ""
          config_timezone: America/New_York
          plugin_languages: yes
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          plugin_languages_threshold: 1%

      # ------------------------------------------------------------------
      # 3. Isometric contribution calendar
      # ------------------------------------------------------------------
      - name: Isocalendar
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.isocalendar.svg
          base: ""
          config_timezone: America/New_York
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

      # ------------------------------------------------------------------
      # 4. Achievements
      # ------------------------------------------------------------------
      - name: Achievements
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.achievements.svg
          base: ""
          config_timezone: America/New_York
          plugin_achievements: yes
          plugin_achievements_threshold: B
          plugin_achievements_secrets: yes
          plugin_achievements_display: compact
          plugin_achievements_limit: 0
